<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta property="og:title" content="Change Inbox">
<meta property="og:description" content="Homework: Unit 3, Change.">
<meta property="og:image" content="https://tanyapzk.github.io/vocabulary-app/assets/og-image.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Change Inbox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: a desktop mail client — folder rail · message list · reading pane; stacks on narrow screens */
:root{
  --bg:#ECEBE6; --panel:#FBFAF7; --panel-2:#F4F2EC; --ink:#16181B; --muted:#6C6861; --line:#DCD8CE;
  --accent:#2338A8; --accent-soft:#E4E8FB; --accent-ink:#FFFFFF;
  --ok:#25704A; --ok-soft:#E1F1E7; --no:#AE3328; --no-soft:#F8E3E0; --hl:#FFF0B8;
  --display:"Instrument Serif","Iowan Old Style",Georgia,serif;
  --sans:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --ease:cubic-bezier(0.22,1,0.36,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121417; --panel:#1A1D21; --panel-2:#20242A; --ink:#ECEAE4; --muted:#9A968E; --line:#2E333A;
  --accent:#8EA0FF; --accent-soft:#252C4F; --accent-ink:#0E1022;
  --ok:#6FCF97; --ok-soft:#1B3326; --no:#F08A7E; --no-soft:#3A2220; --hl:#4A4220; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121417; --panel:#1A1D21; --panel-2:#20242A; --ink:#ECEAE4; --muted:#9A968E; --line:#2E333A;
  --accent:#8EA0FF; --accent-soft:#252C4F; --accent-ink:#0E1022;
  --ok:#6FCF97; --ok-soft:#1B3326; --no:#F08A7E; --no-soft:#3A2220; --hl:#4A4220; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.shell{height:100%;padding-inline:16px;padding-block:16px;display:flex}
.app{flex:1;min-height:0;display:grid;grid-template-columns:210px 340px minmax(0,1fr);background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;max-width:1440px;margin:0 auto;width:100%}

/* rail */
.rail{background:var(--panel-2);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:18px;min-width:0;overflow:auto}
.brand{display:flex;flex-direction:column;gap:2px}
.brand b{font-family:var(--display);font-size:30px;font-weight:400;line-height:1;letter-spacing:-.01em}
.brand span{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.folders{display:grid;gap:2px}
.folder{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-radius:8px;font-weight:500;font-size:14px}
.folder.on{background:var(--panel);box-shadow:0 0 0 1px var(--line)}
.folder .ct{font-family:var(--mono);font-size:12px;color:var(--accent);font-variant-numeric:tabular-nums}
.folder.dim{color:var(--muted)}
.prog{display:grid;gap:8px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.prog-top{display:flex;justify-content:space-between;align-items:baseline;font-size:13px}
.prog-top b{font-family:var(--mono);font-weight:500;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .6s var(--ease)}
.btn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:9px 14px;font-weight:600;font-size:14px;transition:filter .3s var(--ease),transform .3s var(--ease)}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.ghost:hover{box-shadow:inset 0 0 0 1px var(--muted)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.rail h4{margin:0;font-family:var(--mono);font-size:11px;font-weight:500;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.words{display:flex;flex-wrap:wrap;gap:5px}
.wchip{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:3px 7px;font-size:12.5px}
.wchip:hover{border-color:var(--accent);color:var(--accent)}
.rail-foot{margin-top:auto;display:grid;gap:8px}
.copied{font-size:12.5px;color:var(--ok);min-height:1.2em}
.reset{background:none;border:0;padding:0;font-size:12px;color:var(--muted);text-decoration:underline;justify-self:start}

/* list */
.list{border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;min-height:0}
.list-head{padding:16px 16px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline}
.list-head h2{margin:0;font-size:15px;font-weight:600}
.list-head span{font-family:var(--mono);font-size:12px;color:var(--muted)}
.msgs{overflow:auto;flex:1}
.msg{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:13px 16px;position:relative;transition:background .25s var(--ease)}
.msg:hover{background:var(--panel-2)}
.msg.sel{background:var(--accent-soft)}
.msg .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-weight:600;color:#fff}
.msg .meta{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.msg .from{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg .time{font-family:var(--mono);font-size:11.5px;color:var(--muted);flex:none}
.msg .subj{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg .prev{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg.unread .subj{font-weight:600}
.msg.unread::before{content:"";position:absolute;left:6px;top:24px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.msg .state{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;margin-top:4px;color:var(--muted)}
.msg .state.done{color:var(--ok)}

/* reader */
.reader{min-width:0;min-height:0;overflow:auto;background:var(--panel)}
.letter{max-width:760px;margin:0 auto;padding:32px 40px 64px;display:grid;gap:22px}
.subject{font-family:var(--display);font-size:clamp(30px,3.2vw,42px);line-height:1.05;font-weight:400;margin:0;letter-spacing:-.01em;text-wrap:balance}
.hdr{display:flex;gap:12px;align-items:center;padding-bottom:18px;border-bottom:1px solid var(--line)}
.hdr .av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:600;color:#fff;flex:none}
.hdr .who{display:grid;min-width:0}
.hdr .who b{font-size:15px}
.hdr .who span{font-size:13px;color:var(--muted)}
.hdr .when{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.body p{margin:0 0 12px;max-width:66ch}
.body{font-size:16px}
.w{background:none;border:0;padding:0 1px;font:inherit;color:inherit;border-bottom:1.5px dotted var(--accent);background-image:linear-gradient(var(--accent-soft),var(--accent-soft));background-size:100% 40%;background-repeat:no-repeat;background-position:0 90%;cursor:help}
.w:hover{color:var(--accent)}
.hint{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center}
.hint i{display:inline-block;width:22px;height:0;border-bottom:1.5px dotted var(--accent)}

.task{border:1px solid var(--line);border-radius:12px;background:var(--panel-2);padding:18px 20px;display:grid;gap:14px}
.task-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.task-h h3{margin:0;font-size:15px;font-weight:600}
.task-h .sc{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.q{display:grid;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0;padding-top:0}
.q p{margin:0;font-weight:500}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;font-size:14px;text-align:left;transition:border-color .25s var(--ease),background .25s var(--ease)}
.opt:hover{border-color:var(--accent)}
.opt.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.opt.wrong{background:var(--no-soft);border-color:var(--no);color:var(--no);animation:nudge .3s var(--ease)}
@keyframes nudge{30%{transform:translateX(-3px)}70%{transform:translateX(3px)}}
.fb{font-size:13.5px;color:var(--muted)}
.fb b{color:var(--ink)}
.match{display:grid;grid-template-columns:minmax(0,180px) minmax(0,1fr) 24px;gap:8px 12px;align-items:center}
.match .term{font-weight:600}
.match select{width:100%;font:inherit;font-size:14px;padding:7px 8px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.match select.ok{border-color:var(--ok);background:var(--ok-soft)}
.match select.bad{border-color:var(--no);background:var(--no-soft)}
.mk{font-family:var(--mono);font-size:13px}
.mk.ok{color:var(--ok)} .mk.bad{color:var(--no)}
.gap{display:inline-block;min-width:90px;border-bottom:1.5px solid var(--muted);text-align:center;font-weight:600;padding:0 4px}
.gap.filled{border-color:var(--ok);color:var(--ok)}

.voice{display:flex;gap:14px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--panel)}
.play{width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.wave{flex:1;display:flex;gap:3px;align-items:center;height:30px;min-width:0;overflow:hidden}
.wave i{flex:1;min-width:2px;max-width:5px;border-radius:2px;background:var(--line)}
.voice.on .wave i{background:var(--accent);animation:bob 1s var(--ease) infinite alternate}
@keyframes bob{to{transform:scaleY(.4)}}
.vctl{display:flex;gap:6px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:4px 10px;font-size:12.5px}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.transcript{border-left:2px solid var(--accent);padding:4px 0 4px 14px;color:var(--ink)}
.transcript p{margin:0 0 8px}

textarea{width:100%;min-height:200px;font:inherit;font-size:15px;line-height:1.6;padding:14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);resize:vertical}
.used{display:flex;flex-wrap:wrap;gap:6px}
.used span{font-size:12.5px;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted);transition:all .3s var(--ease)}
.used span.on{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.prompts{margin:0;padding-left:20px;display:grid;gap:4px}
.wc{font-family:var(--mono);font-size:12px;color:var(--muted)}
.next{justify-self:start}
.sig{color:var(--muted);font-size:14px}

/* popover */
.pop{position:fixed;z-index:20;width:300px;max-width:calc(100vw - 32px);background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.16);padding:14px 16px;display:grid;gap:6px}
.pop[hidden]{display:none}
.pop b{font-family:var(--display);font-size:24px;font-weight:400;line-height:1.1}
.pop .ru{font-size:13px;color:var(--muted)}
.pop .ex{font-size:14px;border-top:1px solid var(--line);padding-top:8px}
.pop .top{display:flex;align-items:center;gap:10px}
.snd{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--panel-2);color:var(--accent);display:grid;place-items:center;flex:none;padding:0;transition:background .25s var(--ease),border-color .25s var(--ease)}
.snd:hover,.snd.on{background:var(--accent-soft);border-color:var(--accent)}
.snd svg{width:18px;height:18px}
.pop .exr{display:flex;align-items:flex-start;gap:10px;border-top:1px solid var(--line);padding-top:8px}
.pop .exr .ex{border:0;padding:0;flex:1}
.pop .ex em{font-style:normal;background:var(--hl);padding:0 2px;border-radius:2px}

@media (max-width:1060px){
  .app{grid-template-columns:300px minmax(0,1fr)}
  .rail{grid-column:1/-1;border-right:0;border-bottom:1px solid var(--line);flex-direction:row;flex-wrap:wrap;align-items:flex-start}
  .rail .words-wrap{display:none}
  .rail-foot{margin-top:0}
}
@media (max-width:760px){
  .shell{height:auto;display:block}
  .app{display:block}
  .msgs{max-height:none}
  .list{border-right:0;border-bottom:1px solid var(--line)}
  .letter{padding:24px 18px 48px}
  .match{grid-template-columns:1fr 24px}
  .match .term{grid-column:1/-1}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="shell">
<div class="app">
  <aside class="rail">
    <div class="brand"><b>Inbox</b><span>Unit 3 · Change</span></div>
    <nav class="folders" aria-label="Folders">
      <div class="folder on">Inbox <span class="ct" id="unreadCt"></span></div>
      <div class="folder dim">Sent</div>
      <div class="folder dim">Drafts</div>
    </nav>
    <div class="prog">
      <div class="prog-top"><span>Homework</span><b id="progTxt">0 / 6</b></div>
      <div class="bar"><i id="progBar"></i></div>
    </div>
    <div class="words-wrap" style="display:grid;gap:8px">
      <h4>Phrases of the week</h4>
      <div class="words" id="railWords"></div>
    </div>
    <div class="rail-foot">
      <button class="btn" id="copyBtn" type="button">Copy my answers</button>
      <p class="copied" id="copyMsg" aria-live="polite"></p>
      <textarea id="copyFallback" hidden readonly aria-label="Your answers"></textarea>
      <button class="reset" id="resetBtn" type="button">Start over</button>
    </div>
  </aside>

  <section class="list" aria-label="Messages">
    <div class="list-head"><h2>Inbox</h2><span id="todayLbl">Mon</span></div>
    <div class="msgs" id="msgs"></div>
  </section>

  <main class="reader" id="reader" aria-live="polite"></main>
</div>
</div>

<div class="pop" id="pop" hidden role="dialog" aria-label="Word meaning"></div>

<script>
(function(){
const $=id=>document.getElementById(id);

/* ---------- glossary ---------- */
const G={
 transform:{w:"transform the corporate culture",d:"to change how a whole company thinks and works, completely",ru:"кардинально изменить корпоративную культуру",ex:"The new CEO set out to <em>transform the corporate culture</em> from top to bottom."},
 withtimes:{w:"move with the times",d:"to change and use new ideas so you don't become old-fashioned",ru:"идти в ногу со временем",ex:"To survive, the company had to <em>move with the times</em> and digitise its paperwork."},
 implement:{w:"implement changes",d:"to start putting new plans or rules into practice",ru:"внедрять изменения",ex:"After the audit, the safety team moved quickly to <em>implement changes</em> to the evacuation procedure."},
 inplace:{w:"put something in place",d:"to set up a system or rule so that it starts working",ru:"ввести, наладить (систему, процедуру)",ex:"We need to <em>put</em> a stricter reporting system <em>in place</em> before the next inspection."},
 oversee:{w:"oversee the implementation",d:"to supervise how a plan is put into action",ru:"контролировать внедрение",ex:"A senior manager will <em>oversee the implementation</em> of the new safety protocols."},
 streamline:{w:"streamline a process",d:"to make a process simpler, faster and less complicated",ru:"упростить, оптимизировать процесс",ex:"We are trying to <em>streamline the process</em> for reporting near-miss incidents."},
 embrace:{w:"embrace change",d:"to accept change happily and with enthusiasm",ru:"принимать перемены с готовностью",ex:"The younger staff were ready to <em>embrace change</em>, but the veterans tended to resist change."},
 resist:{w:"resist change",d:"to try to stop change or refuse to accept it",ru:"сопротивляться переменам",ex:"The younger staff were ready to embrace change, but the veterans tended to <em>resist change</em>."},
 aversion:{w:"an aversion to change",d:"a strong dislike of change",ru:"неприятие перемен",ex:"Many senior employees showed <em>an aversion to change</em> and kept using the old forms."},
 anticipate:{w:"anticipate problems",d:"to expect difficulties before they happen and prepare for them",ru:"предвидеть проблемы",ex:"A good safety manager learns to <em>anticipate</em> potential <em>problems</em> before they become incidents."},
 efficient:{w:"efficient",d:"working well without wasting time, money or energy",ru:"продуктивный, без лишних затрат",ex:"The new filing system is <em>efficient</em>: it saves us a lot of time."},
 effective:{w:"effective",d:"producing the result you want",ru:"эффективный, дающий результат",ex:"Only the training course was truly <em>effective</em> in reducing errors."},
 accommodate:{w:"accommodate needs",d:"to adjust your plans so they fit what people need",ru:"учитывать потребности",ex:"The training programme was redesigned to <em>accommodate the needs</em> of employees with disabilities."},
 assess:{w:"assess progress",d:"to look carefully at how far something has moved forward",ru:"оценивать прогресс",ex:"Managers meet every quarter to <em>assess progress</em> towards the safety targets."},
 facilitate:{w:"facilitate cultural change",d:"to make it easier for a company's habits and attitudes to change",ru:"способствовать культурным переменам",ex:"Open communication can <em>facilitate cultural change</em> within a large organisation."},
 bare:{w:"do the bare minimum",d:"to do only what is absolutely necessary, and nothing more",ru:"делать необходимый минимум",ex:"When people feel ignored, they tend to <em>do the bare minimum</em> and no more."},
 morale:{w:"boost morale",d:"to make people in a group feel more positive and confident",ru:"поднять моральный дух",ex:"A small team event can <em>boost morale</em> after a stressful month."},
 generate:{w:"generate enthusiasm",d:"to make people feel excited and interested",ru:"вызывать энтузиазм",ex:"The new wellbeing programme managed to <em>generate</em> real <em>enthusiasm</em> among the staff."},
 procedure:{w:"procedure (vs process)",d:"the official, step-by-step way of doing something",ru:"установленный порядок",ex:"Following the emergency <em>procedure</em> is mandatory."},
 process:{w:"process (vs procedure)",d:"a series of actions or changes that takes time",ru:"процесс",ex:"The approval <em>process</em> itself can be made shorter."},
 means:{w:"the means (vs ability)",d:"the money or resources you need to do something",ru:"средства, ресурсы",ex:"The company has <em>the means</em> to expand, but it lacks the ability to manage rapid growth."}
};
const railOrder=["transform","withtimes","implement","inplace","oversee","streamline","embrace","resist","aversion","anticipate","efficient","effective","accommodate","assess","facilitate","bare","morale","generate","procedure","process","means"];
const W=(k,t)=>`<button type="button" class="w" data-g="${k}">${t||G[k].w}</button>`;

/* ---------- state ---------- */
const KEY="change-inbox-u3";
let S={read:{},ans:{},first:{},reply:""};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s) S=Object.assign(S,s);}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}};

/* ---------- quiz data ---------- */
const HRQ=[
 {q:"What will the company do in January?",o:["Implement changes and put a new system in place","Move to a new office","Hire a new leadership team"],a:0},
 {q:"How does Dana expect people to react?",o:["Differently: some will like it, some won't","Everyone will be excited","Nobody will like it"],a:0},
 {q:"In Dana's email, “more efficient” means…",o:["spending less time on admin","getting better results","working longer hours"],a:0},
 {q:"What will managers do in the next few weeks?",o:["Assess progress in each team","Choose new team members","Cancel hybrid work"],a:0},
 {q:"Why does Dana mention morale?",o:["People haven't been feeling very positive lately","Morale is the name of the new system","She wants people to work harder"],a:0},
 {q:"What does Dana say people tend to do when they feel ignored?",o:["The bare minimum","Work longer hours","Leave the company"],a:0}
];
const JESS=[["implement changes","to start using new plans or rules in practice"],["put something in place","to set up a rule or system so it starts working"],["transform the corporate culture","to completely change how a company thinks and behaves"],["streamline a process","to make a process simpler and faster"],["embrace change","to accept change happily"],["anticipate problems","to expect difficulties and prepare for them"],["accommodate needs","to adjust your plans to fit what people need"],["assess progress","to check carefully how far something has moved forward"],["facilitate cultural change","to make it easier for a company's habits and attitudes to change"],["boost morale","to make people feel more positive and motivated"]];
const CHRIS=[
 {q:"Chris thinks everyone will love the new system on day one.",a:false},
 {q:"Some people are worried the system will mean more work.",a:true},
 {q:"Chris is going to talk to each person on the team.",a:true},
 {q:"Chris would prefer to hear concerns later, after the switch.",a:false},
 {q:"A more flexible schedule might be possible during the switch.",a:true}
];
const MIKE=[
 {pre:"The new tool should make our reporting more",post:"— we'll spend way less time on paperwork.",o:["efficient","effective"],a:0,fb:"<b>efficient</b> = no wasted time or effort. <b>effective</b> = gets the result you want."},

function mcq(root,data,prefix,scId){
 data.forEach((q,i)=>{
  const d=document.createElement('div'); d.className="q";
  d.innerHTML=`<p>${i+1}. ${q.q}</p><div class="opts"></div>`;
  const order=q.o.map((_,k)=>k); const rot=(i*2+1)%order.length; const ord=order.slice(rot).concat(order.slice(0,rot));
  ord.forEach(k=>{ const b=document.createElement('button'); b.type="button"; b.className="opt"; b.id=`${prefix}${i}o${k}`; b.textContent=q.o[k];
   b.addEventListener('click',()=>{ if(S.ans[prefix+i]===q.a) return; if(S.first[prefix+i]===undefined) S.first[prefix+i]=(k===q.a); if(k===q.a) S.ans[prefix+i]=k; save(); paint(k); sc(); renderList(); });
   d.querySelector('.opts').appendChild(b); });
  const paint=(clicked)=>{ d.querySelectorAll('.opt').forEach(b=>{ const k=+b.id.split('o').pop(); b.classList.remove('right','wrong'); if(S.ans[prefix+i]===q.a&&k===q.a) b.classList.add('right'); else if(clicked===k&&k!==q.a){ void b.offsetWidth; b.classList.add('wrong'); } }); };
  root.appendChild(d); paint();
 });
 const sc=()=>{$(scId).textContent=`${data.filter((q,i)=>S.ans[prefix+i]===q.a).length} / ${data.length}`;}; sc();
}

let speaking=false, audioEl=null;
function toggleVoice(){
 if(speaking){ stopVoice(); return; }
 stopPopAudio();
 const slow=$('slow')&&$('slow').getAttribute('aria-pressed')==="true";
 const a=new Audio('audio/chris.mp3'); a.playbackRate=slow?0.82:1; a.preservesPitch=true; audioEl=a;
 const fail=()=>{ stopVoice(); const t=$('tr'); if(t) t.hidden=false; const n=$('vnote'); if(n) n.textContent="The audio could not be loaded, so read the message instead."; };
 a.onended=()=>stopVoice(); a.onerror=fail;
 speaking=true;
 const vc=$('voice'); if(vc) vc.classList.add('on'); const p=$('play'); if(p){p.innerHTML=IC_PAUSE; p.setAttribute('aria-label','Stop voice message');}
 const pr=a.play(); if(pr&&pr.catch) pr.catch(fail);
}
function stopVoice(){ if(audioEl){ audioEl.onended=null; audioEl.onerror=null; try{audioEl.pause();}catch(e){} audioEl=null; } speaking=false; const vc=$('voice'); if(vc) vc.classList.remove('on'); const p=$('play'); if(p){p.innerHTML=IC_PLAY; p.setAttribute('aria-label','Play voice message');} }

/* ---------- glossary popover ---------- */
const pop=$('pop');
let popAudio=null;
function stopPopAudio(){ if(popAudio){ popAudio.onended=null; try{popAudio.pause();}catch(e){} popAudio=null; } pop.querySelectorAll('.snd.on').forEach(b=>b.classList.remove('on')); }
function playPop(btn,file){
 const was=btn.classList.contains('on'); stopPopAudio(); if(was) return;
 const a=new Audio('audio/'+file+'.mp3'); popAudio=a; btn.classList.add('on');
 a.onended=()=>stopPopAudio(); a.onerror=()=>stopPopAudio();
 const p=a.play(); if(p&&p.catch) p.catch(()=>stopPopAudio());
}
function showPop(k,anchor){
 const g=G[k]; if(!g) return; stopPopAudio(); stopVoice();
 const SPK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z" fill="currentColor"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>';
 pop.innerHTML=`<div class="top"><button type="button" class="snd" data-a="w-${k}" aria-label="Listen to the word">${SPK}</button><b>${g.w}</b></div><span>${g.d}</span><span class="ru">${g.ru}</span><div class="exr"><button type="button" class="snd" data-a="e-${k}" aria-label="Listen to the example">${SPK}</button><span class="ex">${g.ex}</span></div>`;
 pop.querySelectorAll('.snd').forEach(b=>b.addEventListener('click',()=>playPop(b,b.dataset.a)));
 pop.hidden=false;
 const r=anchor.getBoundingClientRect(); const pw=pop.offsetWidth, ph=pop.offsetHeight;
 let x=Math.min(Math.max(16,r.left),window.innerWidth-pw-16); let y=r.bottom+8; if(y+ph>window.innerHeight-12) y=Math.max(12,r.top-ph-8);
 pop.style.left=x+"px"; pop.style.top=y+"px";
 playPop(pop.querySelector('.snd[data-a^="w-"]'),'w-'+k);
}
document.addEventListener('click',e=>{ const w=e.target.closest('[data-g]'); if(w){ e.stopPropagation(); showPop(w.dataset.g,w); return; } if(!e.target.closest('#pop')){ pop.hidden=true; stopPopAudio(); } });
document.addEventListener('keydown',e=>{ if(e.key==="Escape"){ pop.hidden=true; stopPopAudio(); } });
